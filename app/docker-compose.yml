# Verity: customer support assistant that answers only with the business's documentation.
#
# Runs ENTIRELY on your machine: no cloud, no remote deploy. "docker compose up" in this folder
# IS the deployment. Secrets (API_KEYS, ORIGIN_VERIFY_SECRET) arrive via shell environment
# variables, never a versioned file; the exam generates an ephemeral key.
#
#   user ──► gateway ──► ollama           (chat + embeddings)
#               ▲
#   indexer ────┘                         (builds the index at startup and exits)
#   evaluator ──┘                         (only for evaluating; doesn't start with "up"; writes its
#                                          report to eval-result.json, no tracking server)
#   seaweedfs ─────────────────────────── (only for versioning knowledge/ with DVC; "dvc" profile,
#                                          also doesn't start with "up". See app/dvc-setup.sh)
#
# What's visible from outside: ONLY the gateway (and seaweedfs, if you bring it up by hand for
# dvc push/pull). Ollama always listens on 127.0.0.1; it has no auth of its own and must never be
# exposed.
#
# Run from this folder (app/). Bot configuration: config.env, at the repo root (each service gets
# it via env_file).
# Ports, container prefix and memory limits: the values are HERE, after ":-" (e.g.
# ${GATEWAY_PORT:-8000}). Memory limits must add up to less than the machine's RAM, leaving ~1 GB
# for the system: with 8 GB, 6 + 1 = 7. If Ollama goes over its limit, only it dies, not the rest.

# Project name: container and network names come from it.
# Volumes do NOT depend on it (they have their own explicit name, below), so changing it never
# loses data.
name: verity

# Base image versions: pinned HERE, in one place. Before changing one, check it exists. Changing
# PYTHON_VERSION requires running "make lock". (Python packages are declared in pyproject.toml,
# not here.)
x-python: &python
  PYTHON_VERSION: "3.11"
  UV_VERSION: 0.12.17

services:
  # ── Language models ─────────────────────────────────────────────────────────
  ollama:
    image: ${IMAGE_PREFIX:-verity}-ollama:${IMAGE_TAG:-local}
    build:
      context: ./docker/ollama
      args:
        OLLAMA_VERSION: 0.34.2
    container_name: ${CONTAINER_PREFIX:-verity}-ollama
    restart: unless-stopped
    mem_limit: ${OLLAMA_MEM_LIMIT:-6g}   # cap: so it doesn't starve the gateway
    env_file:
      - ../config.env
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"   # its own server only
    volumes:
      - ollama_data:/root/.ollama   # models persist across restarts
    healthcheck:
      # Healthy only once ALL the models in the list are already downloaded
      test: ["CMD-SHELL", "for m in $$(echo \"$$MODELS\" | tr ',' ' '); do ollama list | grep -q \"$${m%%:*}\" || exit 1; done"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ── Vector index ─────────────────────────────────────────────────────────────
  # A one-shot job: chunks knowledge/ (baked into the image), computes the vectors with the same
  # Ollama that answers later, and exits. This keeps the index always matching the documents and
  # the model. It's the same image as the gateway.
  indexer:
    image: ${IMAGE_PREFIX:-verity}-gateway:${IMAGE_TAG:-local}
    container_name: ${CONTAINER_PREFIX:-verity}-indexer
    command: ["python", "-m", "rag.build_index"]
    env_file:
      - ../config.env
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      - index_data:/srv/artifacts/index
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ── The bot's API ────────────────────────────────────────────────────────────
  gateway:
    image: ${IMAGE_PREFIX:-verity}-gateway:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
      args: *python
    container_name: ${CONTAINER_PREFIX:-verity}-gateway
    restart: unless-stopped
    mem_limit: ${GATEWAY_MEM_LIMIT:-1g}
    env_file:
      - ../config.env
    environment:
      OLLAMA_URL: http://ollama:11434   # service name on the compose network
      APP_VERSION: ${IMAGE_TAG:-local}   # returned as "release" in every response
      # Secrets: you export them yourself in your shell before bringing up the stack. Without
      # API_KEYS the gateway refuses to start, unless AUTH_DISABLED=true (ONLY for testing;
      # app/run/run.sh uses it).
      API_KEYS: ${API_KEYS:-}
      ORIGIN_VERIFY_SECRET: ${ORIGIN_VERIFY_SECRET:-}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"   # the only thing published outward
    volumes:
      - index_data:/srv/artifacts/index:ro
    depends_on:
      indexer:
        condition: service_completed_successfully   # doesn't serve until the index is done

  # ── Command-line tools (evaluation) ─────────────────────────────────────────
  # Doesn't start with "up": launched by app/run/run.sh, by hand. Mounts the repository. Writes
  # its report to eval-result.json (see app/eval/run_eval.py): no tracking server, history is
  # built from those files.
  evaluator:
    image: ${IMAGE_PREFIX:-verity}-evaluator:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/evaluator/Dockerfile
      args: *python
    profiles: ["evaluator"]
    env_file:
      - ../config.env
    environment:
      GATEWAY_URL: http://gateway:8000
      OLLAMA_URL: http://ollama:11434
      # The same keys the gateway started with (the exam's own are ephemeral)
      API_KEYS: ${API_KEYS:-}
      ORIGIN_VERIFY_SECRET: ${ORIGIN_VERIFY_SECRET:-}
      # Commit the exam runs against: computed outside (only app/ is mounted here, not the full
      # repo). Set by app/run/run.sh; see git_info() in run_eval.py.
      GIT_COMMIT: ${GIT_COMMIT:-}
      GIT_DIRTY: ${GIT_DIRTY:-}
    volumes:
      - .:/work
    depends_on:
      gateway:
        condition: service_started   # pulls in ollama too

  # ── S3 storage for DVC (versioning knowledge/) ──────────────────────────────
  # SeaweedFS, not MinIO or Garage: a single official image (no third-party mirrors, no login —
  # MinIO deleted its Docker Hub repo in 2025 and locked down Quay), and it ships a web interface
  # for browsing files out of the box (the filer, port 8888), plus the S3 API. Not needed to run
  # the bot (knowledge/ is already inside the image) — only for "make dvc-push/pull".
  # S3 credentials: generated and configured by app/dvc-setup.sh (never committed).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: ${CONTAINER_PREFIX:-verity}-seaweedfs
    profiles: ["dvc"]
    restart: unless-stopped
    command: >
      server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024
    volumes:
      - seaweedfs_data:/data
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_PORT:-8333}:8333"   # S3 API (what DVC uses)
      - "127.0.0.1:${SEAWEEDFS_UI_PORT:-8888}:8888"   # filer web UI (browsing only; not meant for production)

# Explicitly named: they don't change even if the project or folder name changes.
volumes:
  ollama_data:   # downloaded models
    name: verity_ollama_data
  index_data:    # the vector index the indexer generates
    name: verity_index_data
  seaweedfs_data:   # the versioned documents SeaweedFS stores
    name: verity_seaweedfs_data
