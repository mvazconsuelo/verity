# ÚNICO lugar donde se declaran las dependencias de Python del proyecto.
# Tras editarlo, regenera uv.lock (el CI comprueba que corresponda; ver README): fija TODAS las versiones (también las
# transitivas). Cada imagen instala solo su grupo. No hace falta fijar NumPy a mano: el lock
# elige la versión compatible con el Python de cada imagen.

[project]
name = "verity"
version = "0.1.0"
requires-python = ">=3.11"

# Imagen "gateway": la API del bot. La usan también el indexer (rag/build_index.py, escribe el
# índice) y el propio gateway (rag/index_store.py vía gateway/main.py, lo busca): comparten imagen.
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "sqlite-vec>=0.1.6",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
# Pruebas del gateway (se ejecutan en el CI con: uv run --group test pytest)
test = [
    "pytest>=8",
]
# Imagen "evaluator": corre el examen (app/eval/run_eval.py), que solo usa la librería estándar de
# Python y rag/loaders.py (tampoco tiene dependencias externas) — por ahora no necesita nada acá.
# Se deja el grupo definido (vacío) porque el Dockerfile hace "uv sync --only-group evaluator".
evaluator = []
# Herramienta de desarrollo (nunca va en ninguna imagen): versiona knowledge/ contra SeaweedFS.
# Uso: uv run --group dvc dvc <comando> (ver app/dvc-setup.sh y Makefile).
dvc = [
    "dvc[s3]>=3.55",
]
