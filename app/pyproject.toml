# THE ONLY place where the project's Python dependencies are declared.
# After editing it, regenerate uv.lock (CI checks it matches; see README): it pins ALL versions
# (transitive ones too). Each image installs only its group. No need to pin NumPy by hand: the
# lock picks the version compatible with each image's Python.

[project]
name = "verity"
version = "0.1.0"
requires-python = ">=3.11"

# "gateway" image: the bot's API. Also used by the indexer (rag/build_index.py, writes the
# index) and the gateway itself (rag/index_store.py via gateway/main.py, reads it): they share
# the image.
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "sqlite-vec>=0.1.6",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
# Gateway tests (run in CI with: uv run --group test pytest)
test = [
    "pytest>=8",
]
# "evaluator" image: runs the exam (app/eval/run_eval.py), which only uses Python's standard
# library and rag/loaders.py (no external dependencies either) — doesn't need anything here for
# now. The group is left defined (empty) because the Dockerfile runs "uv sync --only-group evaluator".
evaluator = []
# Dev tool (never goes into any image): versions knowledge/ against SeaweedFS.
# Usage: uv run --group dvc dvc <command> (see app/dvc-setup.sh and Makefile).
dvc = [
    "dvc[s3]>=3.55",
]
