<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="100%" role="img" aria-label="Arquitectura de Verity: la fila de arriba son chequeos que corren separados del bot (evaluator, GitHub Actions CI) sin conexión hacia abajo; la fila del medio es el camino en vivo de una petición, usuario a gateway a ollama; la fila de abajo construye el índice desde knowledge/ hacia un almacén de solo lectura que consulta el gateway; la última fila es DVC con SeaweedFS versionando los documentos, fuera del camino de las peticiones">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1040" height="540" fill="#0B0F14"/>

  <!-- ══ fila superior: chequeos separados, nunca tocan el runtime de abajo ══ -->
  <rect x="30" y="24" width="300" height="100" rx="10" fill="#0F1722" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="180" y="50" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#CBD5E1">Evaluator</text>
  <text x="180" y="70" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">golden set, a mano</text>
  <text x="180" y="90" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B">llama a POST /ask como cualquier cliente</text>
  <text x="180" y="108" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B">nada lo conecta automáticamente</text>

  <rect x="710" y="24" width="300" height="100" rx="10" fill="#0F1722" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="860" y="50" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#CBD5E1">GitHub Actions (CI)</text>
  <text x="860" y="70" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">ci.yml — corre en cada PR, solo código</text>
  <text x="860" y="90" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B">valida: lint · tests · Docker · secretos</text>
  <text x="860" y="108" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B">sin flecha hacia abajo — nunca corre el bot</text>

  <!-- ══ fila del medio: el camino en vivo de una petición ══ -->
  <rect x="190" y="175" width="140" height="56" rx="10" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="260" y="208" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#E5E7EB">usuario</text>

  <rect x="430" y="165" width="160" height="76" rx="10" fill="#111827" stroke="#22D3EE" stroke-width="2.5"/>
  <text x="510" y="197" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#E5E7EB">gateway</text>
  <text x="510" y="216" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">FastAPI</text>

  <rect x="700" y="153" width="220" height="100" rx="10" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="810" y="192" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#E5E7EB">ollama</text>
  <text x="810" y="214" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">qwen2.5:1.5b (chat)</text>
  <text x="810" y="232" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">bge-m3 (embeddings)</text>

  <line x1="330" y1="203" x2="424" y2="203" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="377" y="191" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#67E8F9">POST /ask</text>

  <line x1="596" y1="203" x2="694" y2="203" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="645" y="191" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#67E8F9">chat + embeddings</text>

  <!-- ══ fila inferior: construcción del índice ══ -->
  <rect x="30" y="340" width="150" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="105" y="375" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#E5E7EB">knowledge/</text>

  <rect x="250" y="340" width="150" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="325" y="375" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#E5E7EB">indexer</text>

  <rect x="430" y="340" width="160" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="510" y="370" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#E5E7EB">índice</text>
  <text x="510" y="388" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">index.db (sqlite-vec)</text>

  <line x1="180" y1="370" x2="244" y2="370" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-muted)"/>
  <text x="212" y="358" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#94A3B8">build</text>

  <line x1="400" y1="370" x2="424" y2="370" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-muted)"/>
  <text x="412" y="358" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#94A3B8">escribe</text>

  <!-- índice -> gateway, recto hacia arriba, misma columna -->
  <line x1="510" y1="340" x2="510" y2="247" stroke="#64748B" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrow-muted)"/>
  <text x="565" y="300" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#94A3B8">solo lectura</text>

  <!-- ══ fila final: versionado de datos ══ -->
  <rect x="30" y="455" width="400" height="70" rx="10" fill="#0F1722" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="230" y="485" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#CBD5E1">DVC → SeaweedFS</text>
  <text x="230" y="505" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">perfil "dvc" — fuera del camino de las peticiones</text>

  <line x1="105" y1="400" x2="105" y2="449" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-muted)" marker-start="url(#arrow-muted)"/>
  <text x="155" y="428" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#94A3B8">push / pull</text>
</svg>
