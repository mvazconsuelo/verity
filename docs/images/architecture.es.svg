<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="100%" role="img" aria-label="Arquitectura de Verity: usuario, gateway, ollama, indexer, índice, evaluador manual, DVC con SeaweedFS para versionar documentos, y GitHub Actions como chequeo de código separado, sin conexión con el runtime">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1040" height="560" fill="#0B0F14"/>

  <!-- ══ CI: un chequeo separado y autocontenido — sin conexión con nada de abajo ══ -->
  <rect x="700" y="24" width="310" height="100" rx="10" fill="#0F1722" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="855" y="50" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#CBD5E1">GitHub Actions (CI)</text>
  <text x="855" y="70" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">ci.yml — corre en cada PR, solo código</text>
  <text x="855" y="90" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B">valida: lint · tests · Docker · secretos</text>
  <text x="855" y="108" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B">sin flecha hacia abajo — nunca corre el bot</text>

  <!-- ══ fila principal ══ -->
  <rect x="200" y="170" width="140" height="56" rx="10" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="270" y="203" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#E5E7EB">usuario</text>

  <rect x="430" y="170" width="160" height="70" rx="10" fill="#111827" stroke="#22D3EE" stroke-width="2.5"/>
  <text x="510" y="200" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#E5E7EB">gateway</text>
  <text x="510" y="218" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">FastAPI</text>

  <rect x="700" y="200" width="220" height="100" rx="10" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="810" y="238" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#E5E7EB">ollama</text>
  <text x="810" y="260" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">qwen2.5:1.5b (chat)</text>
  <text x="810" y="278" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">bge-m3 (embeddings)</text>

  <!-- usuario -> gateway -->
  <line x1="340" y1="198" x2="424" y2="198" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="382" y="186" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#67E8F9">POST /ask</text>

  <!-- gateway <-> ollama -->
  <line x1="596" y1="198" x2="694" y2="198" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="645" y="186" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#67E8F9">chat + embeddings</text>

  <!-- ══ fila de indexado ══ -->
  <rect x="30" y="330" width="150" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="105" y="365" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#E5E7EB">knowledge/</text>

  <rect x="240" y="330" width="150" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="315" y="365" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#E5E7EB">indexer</text>

  <rect x="430" y="330" width="160" height="60" rx="10" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="510" y="360" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#E5E7EB">índice</text>
  <text x="510" y="378" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">index.db (sqlite-vec)</text>

  <rect x="700" y="330" width="220" height="60" rx="10" fill="#0F1722" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="810" y="360" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#CBD5E1">evaluator</text>
  <text x="810" y="378" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">golden set, a mano</text>

  <!-- knowledge -> indexer -->
  <line x1="180" y1="360" x2="234" y2="360" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-muted)"/>
  <text x="207" y="348" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#94A3B8">al construir la imagen</text>

  <!-- indexer -> ollama -->
  <line x1="340" y1="330" x2="700" y2="270" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <text x="430" y="300" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#94A3B8">embeber chunks (una vez, al arrancar)</text>

  <!-- indexer -> índice -->
  <line x1="390" y1="360" x2="424" y2="360" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-muted)"/>
  <text x="407" y="348" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#94A3B8">escribe</text>

  <!-- índice -> gateway (solo lectura) -->
  <line x1="510" y1="330" x2="510" y2="246" stroke="#64748B" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrow-muted)"/>
  <text x="565" y="320" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#94A3B8">solo lectura</text>

  <!-- evaluator -> gateway -->
  <line x1="720" y1="330" x2="594" y2="232" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="690" y="316" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#94A3B8">examen manual (app/run/run.sh)</text>

  <!-- ══ DVC + SeaweedFS ══ -->
  <rect x="30" y="455" width="400" height="80" rx="10" fill="#0F1722" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="230" y="488" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#CBD5E1">DVC → SeaweedFS</text>
  <text x="230" y="508" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">perfil "dvc" — versiona knowledge/, con interfaz web (:8888)</text>
  <text x="230" y="525" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B">fuera del camino de las peticiones: no corre con "docker compose up"</text>

  <!-- knowledge <-> DVC/SeaweedFS -->
  <line x1="105" y1="390" x2="105" y2="449" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-muted)" marker-start="url(#arrow-muted)"/>
  <text x="170" y="422" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#94A3B8">dvc push / pull</text>
</svg>
